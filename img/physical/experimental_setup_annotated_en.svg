<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1644" height="1160" viewBox="0 0 1644 1160">
  <title>Annotated physical MLPM experimental setup</title>
  <desc>Numbered component annotations for the physical MLPM experimental setup.</desc>
  <style>
    .leader-halo { fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .leader { fill:none; stroke:#17324a; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .target { fill:#fff; stroke:#17324a; stroke-width:2.2; }
    .badge { fill:#17324a; stroke:#fff; stroke-width:2.5; }
    .badge-text { fill:#fff; font:600 23px Arial, sans-serif; text-anchor:middle; dominant-baseline:central; }
    .item { fill:#1b2935; font:26px Arial, sans-serif; dominant-baseline:central; }
    .item-num { fill:#17324a; font:700 26px Arial, sans-serif; dominant-baseline:central; }
  </style>

  <image x="0" y="0" width="1644" height="838" xlink:href="experimental_setup_cleaned.jpg"/>

  <!-- Markers refer to visible components; hidden internals are identified by their assemblies. -->
